services:
  postgres:
    image: postgres:16-alpine
    container_name: procurelive-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procurelive}
      POSTGRES_USER: ${POSTGRES_USER:-procurelive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procurelive_user} -d ${POSTGRES_DB:-procurelive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: procurelive-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: procurelive-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@procurelive.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-strong-password}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:

networks:
  default:
    name: procurelive-network
